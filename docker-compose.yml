# NEURA — local development infrastructure.
#
# Provides the stateful services the application depends on. There is no
# application container yet: Next.js runs on the host (or inside WSL2) against
# these ports, which keeps hot reload fast.
#
#   docker compose up -d      start PostgreSQL + Redis
#   docker compose ps         check health
#   docker compose down       stop (data is preserved in named volumes)
#   docker compose down -v    stop and destroy all data

name: neura

services:
  postgres:
    image: postgres:16-alpine
    container_name: neura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neura_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-neura}
      # Speeds up initdb and keeps collation stable across host platforms.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Executed once, only when the data volume is first created.
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-neura} -d ${POSTGRES_DB:-neura}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: neura-redis
    restart: unless-stopped
    # Append-only persistence so pub/sub state and caches survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are embedded during the Next.js build. Supply
        # the deployment origin at image-build time, not only at runtime.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: neura-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-neura}:${POSTGRES_PASSWORD:-neura_dev_password}@postgres:5432/${POSTGRES_DB:-neura}?schema=public
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NEURA}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FILE_STORAGE_ROOT: /data/storage
    ports:
      # Bind the local app port on IPv4 so localhost-based browser checks do
      # not get trapped by Docker Desktop's non-serving IPv6 forwarder.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - app_storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-neura}:${POSTGRES_PASSWORD:-neura_dev_password}@postgres:5432/${POSTGRES_DB:-neura}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: neura_postgres_data
  redis_data:
    name: neura_redis_data
  app_storage:
    name: neura_app_storage
